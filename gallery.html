<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - KhannaVille</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>KhannaVille</h1>
                <p class="tagline">A Nostalgic Journey</p>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#galleries" class="nav-link">Galleries</a>
                <a href="index.html#videos" class="nav-link">Videos</a>
                <a href="index.html#about" class="nav-link">About</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="gallery-page-header">
            <div class="container">
                <div class="gallery-breadcrumb">
                    <a href="index.html" class="breadcrumb-link">Home</a> / 
                    <a href="index.html#galleries" class="breadcrumb-link">Galleries</a> / 
                    <span id="gallery-title-breadcrumb">Gallery</span>
                </div>
                <h1 id="gallery-title">Loading Gallery...</h1>
            </div>
        </section>

        <section class="galleries">
            <div class="container">
                <div class="image-grid" id="image-grid">
                    <!-- Images will be loaded here -->
                </div>
            </div>
        </section>

        <footer class="footer">
            <div class="container">
                <p>&copy; 2005–2026 Gaurav Khanna. Originally hosted on a Power Macintosh G4, Dartmouth, MA.</p>
                <p class="footer-note">KhannaVille has been redesigned and archived for preservation. All original content preserved.</p>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
    <script>
        // Gallery configuration with correct paths
        const galleryConfig = {
            'Beach': { title: 'Beach', path: 'Beach-Thumbnails' },
            'Fall': { title: 'Fall Leaves', path: 'Fall-Thumbnails' },
            'CA': { title: 'California', path: 'CA-Thumbnails' },
            'CapeCod': { title: 'Cape Cod', path: 'CapeCod-Thumbnails' },
            'MtWash': { title: 'Mount Washington', path: 'MtWash-Thumbnails' },
            'Maine': { title: 'Maine', path: 'Maine-Thumbnails' },
            'Germany': { title: 'Germany', path: 'Germany-Thumbnails' },
            'Gnome': { title: 'Gnome Garden', path: 'Gnome-Thumbnails' },
            'MoS': { title: 'Museum of Science', path: 'MoS-Thumbnails' },
            'Nostalgia': { title: 'Nostalgia', path: 'Nostalgia-Thumbnails' },
            'Rach6th': { title: "Rachel's 6th Birthday", path: 'Rach6th-Thumbnails' },
            'VacNY': { title: 'New York Vacation', path: 'VacNY-Thumbnails' },
            'Winter08': { title: 'Winter Wonderland', path: 'Winter08-Thumbnails' },
            'Fall06': { title: 'Fall 2006', path: 'Fall06-Thumbnails' },
            'Bug': { title: 'Bug Collection', path: 'Bug-Thumbnails' }
        };

        function getGalleryId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || 'Beach';
        }

        function loadGallery() {
            const galleryId = getGalleryId();
            const gallery = galleryConfig[galleryId];

            if (!gallery) {
                document.getElementById('gallery-title').textContent = 'Gallery not found';
                return;
            }

            // Update titles
            document.title = gallery.title + ' - KhannaVille';
            document.getElementById('gallery-title').textContent = gallery.title;
            document.getElementById('gallery-title-breadcrumb').textContent = gallery.title;

            // Load images
            const imageGrid = document.getElementById('image-grid');
            imageGrid.innerHTML = '';

            let loadedCount = 0;

            // Try loading images 0-200
            for (let i = 0; i < 200; i++) {
                const imgPath = `media/galleries/${gallery.path}/${i}.jpg`;
                
                // Create and test each image
                const testImg = new Image();
                
                testImg.onload = (function(path, index) {
                    return function() {
                        loadedCount++;
                        
                        // Create image item
                        const item = document.createElement('div');
                        item.className = 'image-item';
                        
                        const img = document.createElement('img');
                        img.src = path;
                        img.alt = `${gallery.title} - Image ${index}`;
                        
                        item.appendChild(img);
                        imageGrid.appendChild(item);
                    };
                })(imgPath, i);

                testImg.src = imgPath;
            }

            // Show message if no images loaded
            setTimeout(() => {
                if (loadedCount === 0) {
                    imageGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #999;">No images found in this gallery.</p>';
                }
            }, 2000);
        }

        // Load gallery when page loads
        document.addEventListener('DOMContentLoaded', loadGallery);
    </script>
</body>
</html>
